"$schema": "https://json-schema.org/draft/2020-12/schema"
description: >
  A guide document: the inverse of a blueprint. A blueprint says "here is
  a part and the slots it accepts"; a guide says "here is a thing you want
  to build and the parts that make it". Authored as a repo fixture and
  loaded into the guides table. See docs/design/guided-builds.md.

  Guides do not use the `constrain` predicate that blueprint slots carry:
  it has no Python implementation and its real semantics (parent,
  siblings, filter) are richer than a guide needs. A guide composes
  require / deny / accept only.
type: object
required:
  - key
  - title
  - steps
  - roles
additionalProperties: false
properties:
  key:
    type: string
    $ref: "#/$defs/url_key"
    description: Stable identifier, used in the URL (/api/guides/<key>).
  title:
    type: string
    minLength: 1
  summary:
    type: string
  steps:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/step"
  roles:
    type: object
    minProperties: 1
    description: >
      The parts a built thing is made of, keyed by role name. A step
      option names the roles that method needs; every role it names is
      resolved to a concrete blueprint.
    propertyNames:
      $ref: "#/$defs/url_key"
    additionalProperties:
      $ref: "#/$defs/role"
  refinements:
    type: array
    description: How someone diverges from the recommendation afterwards.
    items:
      $ref: "#/$defs/refinement"

$defs:
  url_key:
    type: string
    pattern: "^[a-z0-9]+([-_][a-z0-9]+)*\\Z"
    description: >
      A key that is safe in a URL and readable in one. Step and
      refinement keys become query-string keys, because selections are
      one flat map of key to answer; a guide's own key is a path
      segment. Role names never appear in a URL and are held to the
      same shape for consistency with the keys beside them.

      Underscores are allowed because the catalog's own vocabulary is
      full of them — an author naming an option after `wall_on_tile`
      or `dungeon_stone` should not have to respell it.

  predicate:
    type: object
    minProperties: 1
    additionalProperties: false
    description: >
      Tag predicate over blueprints, in the same vocabulary as a
      blueprint slot and the tag_query API schema. `require` and `deny`
      match a tag exactly; `accept` matches it or any tag below it;
      `deny_children` refuses everything *below* a tag while leaving the
      tag itself, and `allow` names the children that survive that
      sweep.
    properties:
      require:
        $ref: "#/$defs/tag_list"
      deny:
        $ref: "#/$defs/tag_list"
      accept:
        $ref: "#/$defs/tag_list"
      deny_children:
        description: >
          Refuse every tag strictly beneath these, keeping the tag
          itself. `require: [component|wall]` with
          `deny_children: [component|wall]` is "a plain wall": the
          arrow slits and curved variants carry a child tag and are
          refused, and listing them by hand would mean revisiting every
          guide whenever a new variant is designed.

          Every tag named in `require` or `allow` is exempt from the
          sweep, which is what makes "shape|floor|wall and nothing else
          under shape|floor" expressible in one predicate. The
          exemption is by exact tag, not by ordering, so `accept` — a
          subtree match with no single tag to spare — does not confer
          it. Combining `accept` with a `deny_children` over the same
          namespace matches nothing.
        $ref: "#/$defs/tag_list"
      allow:
        description: >
          Tags permitted but not required, which exist to survive a
          `deny_children` sweep. Unlike `accept` this asks for nothing:
          a piece without the tag still matches.
        $ref: "#/$defs/tag_list"

  tag_list:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^[^|]+(\\|[^|]+)*$"
      description: Pipe-delimited tag, e.g. "shape|wall".

  when:
    type: object
    minProperties: 1
    additionalProperties: false
    description: >
      Predicate over earlier selections. A step or refinement carrying a
      `when` is reachable only once the selections satisfy it. Declarative
      so that resolution stays a pure function of the selection map.
    properties:
      selected:
        type: object
        minProperties: 1
        description: >
          Step key to the option keys that satisfy it. Several steps in
          one `selected` are ANDed; the option keys within a step are ORed.
        additionalProperties:
          type: array
          minItems: 1
          items:
            type: string

  step:
    type: object
    required:
      - key
      - prompt
      - options
    additionalProperties: false
    properties:
      key:
        $ref: "#/$defs/url_key"
      prompt:
        type: string
        minLength: 1
      default:
        type: string
        description: >
          The option key to recommend, and to assume until the person
          answers. Marked on the button and used for the parts, so the
          page shows a complete buildable set from the first screen
          rather than empty boxes.

          Assuming is not answering: the wizard still walks from the
          first question nobody has answered, so a default never skips
          a question.
      blurb:
        type: string
        description: >
          What to know before answering, shown above the options. For
          what is true of the question rather than of any one answer —
          "all sizes are in inches" belongs here, not repeated on
          eight buttons. Blank lines separate paragraphs.
      links:
        type: object
        minProperties: 1
        description: Phrases in the step's blurb to link, as on an option.
        additionalProperties:
          type: string
          format: uri
          pattern: "^https://"
      when:
        $ref: "#/$defs/when"
      options:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/option"

  option:
    type: object
    required:
      - key
      - title
    additionalProperties: false
    properties:
      key:
        $ref: "#/$defs/url_key"
      title:
        type: string
        minLength: 1
      blurb:
        type: string
      links:
        type: object
        minProperties: 1
        description: >
          Phrases in the blurb to turn into links, mapped to their
          URLs. Here rather than as markup in the blurb because the
          blurb is prose an author writes, and because a name that
          appears twice should link both times without them thinking
          about it. Matched literally, longest phrase first, so
          "Fat Dragon Games" wins over a bare "Fat Dragon".
        additionalProperties:
          type: string
          format: uri
          pattern: "^https://"
      image:
        type: string
        description: Path to an illustration, relative to the image host.
      when:
        $ref: "#/$defs/when"
        description: >
          Offer this option only when earlier steps were answered this
          way. Reads exactly like a step's `when`, and exists because
          gating a whole step is too blunt when it is some of its
          options that do not apply — s2w builds have no tile
          shallower than they are wide, so the depth-1 sizes are not
          offered once s2w is chosen.

          An answer naming an option that this branch does not offer
          counts as unanswered, and the step is asked again. That is
          not a bad request: the key is one the step really has.
      roles:
        type: object
        minProperties: 1
        description: >
          The roles this option's build is made of, each mapped to the
          predicate that role takes under this option, or null when it
          takes none. Per-role rather than per-option because a method
          is not one tag. The s2w composition blueprints put
          `build|s2w` on their floor part (all 40) and
          `build|separate wall` on their wall part (all 32 that have
          one), while their base part denies `build|s2w` in 20 and
          requires it in 17. In the wall guide the same thing happens
          the other way: a separate wall's wall and base want
          `build|separate wall` and its floor must not have it, because
          no floor tile carries that tag.

          An option may leave `roles` out entirely. It then adds no
          roles and its `tags` narrow every role already in play — a
          later step like "how wide?" answers for whatever the method
          turned out to be made of, rather than having to name roles
          that method may not use.
        additionalProperties:
          oneOf:
            - $ref: "#/$defs/predicate"
            - type: "null"
      tags:
        $ref: "#/$defs/predicate"
        description: Predicate applying to every role of this option.

  role:
    type: object
    required:
      - title
      - query
    additionalProperties: false
    properties:
      title:
        type: string
        minLength: 1
      query:
        $ref: "#/$defs/predicate"
      prefer:
        type: array
        minItems: 1
        maxItems: 8
        description: >
          Tags that rank candidates, most wanted first. The recommended
          part is the best-ranked candidate, so a person sees a buildable
          set after one answer. Same tag shape as the predicates, and
          capped because resolution costs one query per preferred tag it
          has to drop: a role asks for at most `len(prefer) + 1`.
        items:
          type: string
          pattern: "^[^|]+(\\|[^|]+)*$"
      under:
        type: string
        description: The role this one sits beneath, when it sits under one.
      match:
        type: array
        minItems: 1
        maxItems: 4
        description: >
          Tag namespaces this role copies from the role it sits `under`,
          once that role has resolved. A base has to match the footprint
          of the piece standing on it, and the size of that piece is not
          known until it is chosen — so `match: ['size|width',
          'size|depth']` on a base means "whatever width and depth the
          part above turned out to be". Requires `under`; the role above
          resolves first. If the part above resolves to nothing, or
          carries no tag in a namespace, that namespace adds no
          constraint rather than matching nothing.
        items:
          type: string
          pattern: "^[^|]+(\\|[^|]+)*$"

  refinement:
    type: object
    required:
      - key
      - role
      - prompt
    additionalProperties: false
    oneOf:
      - required: [from_namespace]
        not:
          anyOf:
            - {required: [on_tags]}
            - {required: [off_tags]}
            - {required: [from_combination]}
      - required: [from_combination]
        not:
          anyOf:
            - {required: [on_tags]}
            - {required: [off_tags]}
            - {required: [from_namespace]}
      - required: [on_tags]
        not:
          anyOf:
            - {required: [from_namespace]}
            - {required: [from_combination]}
    description: >
      Either a pick from a tag namespace (from_namespace) or a toggle
      (on_tags / off_tags), not both. The toggle fields are spelled with
      the _tags suffix because bare `on` and `off` are booleans in the
      YAML the fixtures are authored in.
    properties:
      key:
        $ref: "#/$defs/url_key"
      role:
        type: string
        minLength: 1
        description: Role name this refinement applies to, or "*" for all.
      except_roles:
        type: array
        minItems: 1
        description: >
          Roles this refinement does not apply to, despite `role: "*"`.

          Some parts are not in the vocabulary the question is asked in.
          A floor base is structurally plain — 324 bases carry
          `shape|base|square` and every one of them is `texture|plain`,
          while the textured bases are all wall bases — so asking one
          for a texture matches nothing whatever texture is chosen. It
          is not an exception to be substituted, it is a part the
          question does not apply to.
        items:
          type: string
          minLength: 1
      substitute:
        type: object
        minProperties: 1
        description: >
          Per-role exceptions, keyed by the chosen tag and then by role
          name: what that role should be asked for instead.

          The answer to one question is not always the same tag for
          every part. The catalog has 441 towne walls and no towne base
          at all, because a towne building stands on a wood base — so
          choosing towne has to mean wood for the base roles or it
          empties them. A role with no entry is asked for the chosen
          tag, as usual.

          Only meaningful for a namespace refinement; a toggle already
          names its own tags.
        additionalProperties:
          type: object
          minProperties: 1
          additionalProperties:
            type: string
            pattern: "^[^|]+(\\|[^|]+)*$"
      prompt:
        type: string
        minLength: 1
      default:
        type: string
        description: >
          The answer to recommend and to assume until the person
          answers: a tag for a namespace refinement, the joined tags
          for a combination, or "on"/"off" for a toggle.
      group:
        type: string
        minLength: 1
        description: >
          Heading to file this refinement under. Refinements sharing
          one are drawn together, in the order the document lists
          them, and those without one come first under the default
          heading. For the questions that are real but rarely the
          reason anyone came.
      when:
        $ref: "#/$defs/when"
      from_namespace:
        type: string
        description: >
          Tag namespace to offer, e.g. "texture". Without `choices` the
          options are open — any tag in the namespace — and the
          frontend asks for one as free text.
      from_combination:
        type: string
        description: >
          Like `from_namespace`, but the answers are whole
          *combinations* of tags rather than one tag at a time.

          For a namespace whose tags are not independent. A base is
          OpenLOCK or DragonLock, with magnets or without, and the
          OpenLOCK one may be topless or unsupported but never both —
          three chained yes/nos both misdescribe that and force an
          answer to each. The combinations that exist say it exactly,
          and cannot offer a pairing the catalog does not have.

          Derived like any other answer, so the list narrows with the
          build: a 1-inch dungeon stone wall base has four, a 2-inch
          one has seven.
      exclude:
        type: array
        minItems: 1
        description: >
          Tags to leave out of the combinations. For the ones that add
          length and no meaning: every magnetic base is also
          `connection|magnetic|flex`, so listing both doubles the label
          and distinguishes nothing. Excluded tags are permitted on the
          piece — they are hidden, not refused.
        items:
          type: string
          pattern: "^[^|]+(\\|[^|]+)*$"
      choices:
        type: array
        minItems: 2
        description: >
          The tags to offer, rather than the whole namespace. A wizard
          asks a question you can answer by looking at it, and the
          namespace is not that: 40-odd textures, most of which no wall
          carries. Each has to sit inside `from_namespace`, so the
          refinement still answers to one namespace.

          A title is optional and only cosmetic — without one the
          frontend makes a label out of the tag's last element.
        items:
          type: object
          required: [tag]
          additionalProperties: false
          properties:
            tag:
              type: string
              pattern: "^[^|]+(\\|[^|]+)*$"
            title:
              type: string
              minLength: 1
            blurb:
              type: string
              minLength: 1
      on_tags:
        $ref: "#/$defs/predicate"
      off_tags:
        $ref: "#/$defs/predicate"
