# The first guide: how do I make a wall?
#
# DRAFT — the structure is settled and every role/method pair below was
# resolved against the fixtures, so each recommends a part of the right
# kind. What is not settled is whether they recommend the *right* part:
# the prefer lists are a guess, and with the current ones the wall guide
# leans toward ruined and collapsed variants because those sort first by
# name once prefer runs out. That, and whether a "method" should be a
# build tag at all, is Devon's call (openforge_catalog-z76).
key: wall
title: How do I make a wall?
summary: |
  Three ways to build one, and the difference is where the wall meets the
  floor. Pick a method and you get a printable set; change anything
  afterwards.

steps:
  - key: method
    prompt: How do you want to build it?
    options:
      - key: s2w
        title: Modular (s2w)
        blurb: >
          Wall, floor and base print separately and stack. The most
          flexible, and the most pieces.
        image: sets/dungeon_stone.s2w.wall.1.png
        roles:
          # The s2w base goes with the wall, not under the floor: no s2w
          # floor carries a base slot, and the composition blueprints put
          # fulfills: base on the wall part.
          floor: {require: ['build|s2w', 'shape|floor|wall']}
          wall: {require: ['build|separate wall', 'component|wall']}
          wall-base: {require: ['build|s2w', 'shape|base|wall']}

      - key: wall-on-tile
        title: Wall on tile
        blurb: >
          The wall is part of the floor tile. Fewer pieces, less
          rearranging.
        image: sets/dungeon_stone.wall_on_tile.wall.1.png
        roles:
          # No base carries build|wall on tile: the base under one of
          # these floors is an ordinary one, which is what the
          # synthesised slot asks for.
          floor: {require: ['build|wall on tile'], deny: ['shape|wall']}
          wall: {require: ['build|wall on tile']}
          floor-base: {deny: ['build|s2w']}

      - key: separate-wall
        title: Separate wall
        blurb: >
          Floor tiles and walls are independent; walls stand on their own
          bases wherever you put them.
        image: sets/dungeon_stone.separate_wall.primary_wall.1.png
        roles:
          # The floor takes no build tag on purpose. No floor tile carries
          # build|separate wall — 114 of the 115 records that carry both
          # shape|floor and that tag are bases — so a separate wall stands
          # on an ordinary floor.
          floor: {deny: ['shape|wall']}
          wall: {require: ['build|separate wall']}
          wall-base: {require: ['build|separate wall', 'shape|base|wall']}

  - key: width
    prompt: How wide?
    when: {selected: {method: [s2w, wall-on-tile, separate-wall]}}
    options:
      # These name no roles, so each narrows whatever the method needs.
      - key: '1'
        title: 1 inch
        tags: {require: ['size|width|1']}
      - key: '2'
        title: 2 inch
        tags: {require: ['size|width|2']}
      - key: '4'
        title: 4 inch
        tags: {require: ['size|width|4']}

roles:
  floor:
    title: Floor
    query:
      require: ['shape|floor']
      # A guide never recommends a damaged piece by default; the texture
      # refinement is how someone asks for one. `deny` is an exact match,
      # so each tag is listed — every component|collapsed|* piece carries
      # the bare parent, so that one entry covers the family.
      deny: &intact
        - 'shape|base'
        - 'component|collapsed'
        - 'component|broken'
        - 'component|collapsing_blocks'
        - 'texture|dungeon_stone|ruined'
        - 'texture|rough_stone|ruined'
        - 'texture|cut-stone|ruined'
        - 'texture|towne|ruined_stucco'
    prefer: ['connection|openforge', 'texture|dungeon_stone']
  wall:
    title: Wall
    query:
      require: ['shape|wall']
      deny: *intact
    prefer: ['connection|openforge', 'texture|dungeon_stone']
  floor-base:
    title: Base
    query:
      require: ['shape|base']
      deny: ['shape|base|wall', 'shape|base|s2w']
    prefer: ['texture|plain']
    under: floor
  wall-base:
    title: Base
    query: {require: ['shape|base']}
    prefer: ['connection|magnetic']
    under: wall

refinements:
  - key: texture
    role: '*'
    prompt: Texture
    from_namespace: texture

  - key: side-locks
    role: wall
    prompt: Locks on the wall ends?
    when: {selected: {method: [s2w, separate-wall]}}
    on_tags: {require: ['connection|side|openlock']}
    off_tags: {deny: ['connection|side|openlock']}
