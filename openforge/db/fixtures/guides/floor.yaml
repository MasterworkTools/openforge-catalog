key: floor
title: Floor
hero_image: https://objects.openforge.tools/guides/guide.floor.webp
summary: A plain floor tile

# The floor half of the wall guide, on its own. Someone laying a room or a
# hallway floor needs two decisions — how it prints and how big it is — and
# none of the wall guide's method question, because there is no wall to
# attach. What is left is deliberately the same prose and the same
# predicates, so a floor chosen here and a floor chosen inside the wall
# guide are the same piece.
#
# The one predicate that differs is the floor role's, and it differs on
# purpose: see its comment below.

steps:
  - key: floor-print
    prompt: How should the floor print?
    default: with-base
    # This step introduces the roles. The wall guide's `method` step does
    # that job there; with no method to choose, the first question is the
    # one that decides whether there is a base at all, so `floor` is
    # named here with a null predicate — the role comes into play and
    # takes no constraint from the answer.
    options:
      - key: with-base
        title: Floor plus a base
        blurb: >
          The tile prints bare and sits in a base that carries the
          connectors. The usual openforge arrangement.
        roles:
          # `require: [connection|openforge]` is not decoration. Without it this
          # predicate also admits one-piece OpenLOCK tiles, which already carry
          # their own base — 128 of the 313 otherwise-reachable floors. The
          # recommendation never picks one, but the catalog dialog opens on this
          # predicate, so a person browsing could choose a tile that physically
          # cannot sit in the base shown beneath it.
          floor:
            require:
              - connection|openforge
          # No predicate: the role's own query already requires
          # shape|base|square, and repeating it here says nothing.
          floor-base: null
      - key: single-piece
        title: One piece, base included
        blurb: >
          The tile is printed with its base already part of it. Fewer
          pieces on the table and less to lose.
        roles:
          floor:
            deny:
              - connection|openforge
            allow:
              - connection|openlock

  - key: size
    prompt: What size tiles?
    default: 2x2
    # These eight are the wall guide's list. They do not cover the catalog: 73
    # plain floors have a footprint no answer here reaches — 6x4, 6x6 and 8x8,
    # plus odd pairs like 1x2 and 3x2 — and because this question is not
    # `browsable`, its tags never become relaxable, so browsing cannot reach
    # them either. Widening it is not just adding buttons: 6x4 and 8x8 have no
    # square base at all, so those sizes would empty `floor-base` on the
    # with-base branch. Tracked as openforge_catalog-9ab.
    blurb: >
      All tile sizes are in inches, which are also squares. Most people use
      2×2. 4×2 is handy for hallways, and a few systems have used 3×3 as
      their basis.

      Unlike walls, the thin sizes are fine here: a 1 inch wide floor makes
      a perfectly good hallway, it is only walls that crowd a mini at that
      width.
    options:
      - key: 1x1
        title: 1×1
        roles:
          floor:
            require:
              - size|width|1
              - size|depth|1
      - key: 2x1
        title: 2×1
        roles:
          floor:
            require:
              - size|width|2
              - size|depth|1
      - key: 2x2
        title: 2×2
        roles:
          floor:
            require:
              - size|width|2
              - size|depth|2
      - key: 3x1
        title: 3×1
        roles:
          floor:
            require:
              - size|width|3
              - size|depth|1
      - key: 3x3
        title: 3×3
        roles:
          floor:
            require:
              - size|width|3
              - size|depth|3
      - key: 4x1
        title: 4×1
        roles:
          floor:
            require:
              - size|width|4
              - size|depth|1
      - key: 4x2
        title: 4×2
        roles:
          floor:
            require:
              - size|width|4
              - size|depth|2
      - key: 4x4
        title: 4×4
        roles:
          floor:
            require:
              - size|width|4
              - size|depth|4

roles:
  floor:
    title: Floor
    # A plain square floor. `deny_children: [shape]` refuses
    # `shape|floor|wall`, `shape|curved` and `shape|floor|s2w`; `shape|floor`
    # is spared for being required and `shape|square` for being allowed.
    # `deny_children: [component]` then removes `component|pool` and the rest.
    #
    # `allow: [shape|square]` is load-bearing — without it the sweep takes
    # `shape|square` too and the set is empty, not merely smaller.
    #
    # This is byte-for-byte the wall guide's floor query minus its
    # `allow: [component|wall]`, and measurement says the two select the
    # IDENTICAL 533 pieces. An earlier version of this comment claimed the
    # difference is what keeps wall-bearing tiles out; that was wrong. Every
    # `shape|floor` piece carrying `component|wall` also carries
    # `shape|floor|wall|angled` or `shape|floor|s2w`, so the shape sweep has
    # already taken them before the component sweep runs. The wall guide needs
    # that `allow` only because its *method options* require
    # `shape|floor|wall`, which exempts the tag from the sweep and lets the
    # component term matter. No option here does that, so listing it would be
    # inert — it is left out because it says nothing, not because it is wrong.
    query:
      require:
        - shape|floor
      deny_children:
        - shape
        - component
      allow:
        - shape|square
    prefer:
      - texture|dungeon_stone|block
      - texture|dungeon_stone
      - size|width|2
      - size|depth|2
    avoid:
      - decoration
  floor-base:
    title: Base for the floor
    query:
      require:
        - shape|base
        - shape|base|square
      deny_children:
        - shape|base
    prefer:
      - texture|plain
    under: floor
    match:
      - size|width
      - size|depth

refinements:
  - key: texture
    role: floor
    browsable: true
    prompt: Floor texture
    default: texture|dungeon_stone
    from_namespace: texture
    # No counts in these blurbs, deliberately. The wall guide's equivalents
    # carry them ("71 floors", "38 floors", ...) and every one is now wrong —
    # measured 151/65/77/51/24 against this role. Correcting them would not
    # help, because the honest number depends on the size already chosen and
    # texture is asked AFTER size: dungeon stone is 151 across all sizes, 54 at
    # the default 2x2, and 18 at 4x4. One figure cannot be true of all three,
    # so a number here is wrong in most states the person can be in.
    #
    # What is left is the part that does not rot. Each claim below was checked
    # against the catalog: dungeon stone really is entirely block or eroded,
    # block really is what gets recommended, and the wood floors really are all
    # boarded, in exactly two plank layouts.
    #
    # If counts are wanted, they should be derived — the engine already returns
    # a count per answer for `from_combination` refinements. See
    # openforge_catalog-ume.
    choices:
      - tag: texture|dungeon_stone
        title: Dungeon stone
        blurb: >
          Cut flags, every one of them block or eroded; the recommendation
          is block.
      - tag: texture|rough_stone
        title: Rough stone
      - tag: texture|cut-stone
        title: Cut stone
      - tag: texture|towne
        title: Wood
        blurb: >
          All boarded, in two plank layouts: long planks, or a shorter
          wood.
      - tag: texture|aztlan
        title: Aztlan

  - key: base-clips
    role: "*"
    browsable: true
    # Everything except the floor itself, which is to say the base. Spelled
    # as an exception rather than as `role: floor-base` so that it keeps
    # covering the bases if this guide ever gains another one.
    except_roles:
      - floor
    group: How do the pieces clip together?
    prompt: The base
    when:
      selected:
        floor-print:
          - with-base
    default: connection|magnetic,connection|openlock,connection|openlock|topless
    blurb: >
      Clips are how the bases join to each other. There are two systems, and
      the honest answer is that it rarely matters: the consensus is that
      Dragonbite clips hold better and OpenLOCK clips are easier for rapid
      swapping, but most people agree they aren't different enough to worry
      about. Supporting both is built into how this project is developed,
      from the ground up.

      For what it is worth, I have more OpenLOCK tiles than DragonLock, and
      OpenLOCK is somewhat more widespread.

      Magnets are better if you lay tiles down at game time — they help you
      align tiles quickly, and frankly they have a pleasing feel. The flex
      magnetic bases take 5mm spheres and five cylindrical sizes: 5mm×3mm,
      5mm×2mm, 4mm×3mm, 4mm×2mm and 3/16"×1/8". They spin in place, so you
      never have to think about polarity.

      Topless removes the material above the clip bay, which is not thick to
      begin with: faster to print, and no supports to take out. I don't
      recommend it on its own, though — there is very little contact between
      the top of the base and whatever you glue it to. If you want a single
      central OpenLOCK bay, which is a common choice, take the magnetic
      OpenLOCK base and simply don't fit the magnets. Unsupported is newer:
      modern printers bridge well enough that many people find they don't
      need supports at all.

      Print your clips in PETG, not PLA. PLA is rigid and brittle, so clips
      snap instead of flexing. Keep the bases in whatever you are printing
      everything else in — PETG is harder to glue and harder to paint.

      If a clip will not go into its bay, that is almost always the built-in
      supports: OpenLOCK and DragonLock clips both print with supports you
      have to snap out first. It is the question people ask most.
    links:
      5mm×3mm: https://amzn.to/3TiebAV
      5mm×2mm: https://amzn.to/3n2prFa
      4mm×3mm: https://amzn.to/3JOtXzd
      4mm×2mm: https://amzn.to/3looXJl
      3/16"×1/8": https://www.kjmagnetics.com/proddetail.asp?prod=D32AH
    titles:
      connection|openlock: OpenLOCK
      connection|dragonlock: DragonLock
      connection|magnetic: Magnets
    from_combination: connection
    exclude:
      - connection|magnetic|flex

  - key: floor-clips
    role: floor
    browsable: true
    group: How do the pieces clip together?
    prompt: The floor
    when:
      selected:
        floor-print:
          - single-piece
    default: connection|openlock
    blurb: |
      A one-piece tile carries its own clip bays, so this is the same choice
      the base question asks on the other branch — just made on the tile
      itself.

      Print it in whatever you are printing everything else in. The advice to
      use PETG applies to the clips, not to the tiles they go into: PLA is
      rigid enough that a clip snaps instead of flexing, while a tile has
      nothing to flex.

      Unsupported removes the built-in supports over the clip bay, on the
      bet that a modern printer bridges the gap cleanly. If a clip will not
      go into its bay, that is almost always the supports on the clip itself,
      which both systems print with and which you have to snap out first. It
      is the question people ask most.
    from_combination: connection
    # Only OpenLOCK and OpenLOCK unsupported can ever be offered here — no
    # floor in this role's set carries dragonlock or magnetic, and the
    # dragonlock ones that exist are all ruined tiles the component sweep
    # removes. The other two titles and both exclusions are inert today and
    # kept as cheap cover for a catalog that grows, which is exactly how the
    # counts above went stale.
    titles:
      connection|openlock: OpenLOCK
      connection|dragonlock: DragonLock
      connection|magnetic: Magnets
    exclude:
      - connection|side
      - connection|openforge
