key: floor
title: Floor
hero_image: https://objects.openforge.tools/guides/guide.floor.webp
summary: A plain floor tile

# The floor half of the wall guide, on its own, for laying a floor rather
# than building a wall. Same prose; the predicates differ where noted.

steps:
  - key: floor-print
    prompt: How should the floor print?
    default: with-base
    # Roles come into play only from a chosen step option, so this step is
    # what introduces both.
    options:
      - key: with-base
        title: Floor plus a base
        blurb: >
          The tile prints bare and sits in a base that carries the
          connectors. The usual openforge arrangement.
        roles:
          # Without this the dialog also offers one-piece OpenLOCK tiles,
          # which already are bases and cannot sit in one.
          floor:
            require:
              - connection|openforge
          # The role's own query already requires shape|base|square.
          floor-base: null
      - key: single-piece
        title: One piece, base included
        blurb: >
          The tile is printed with its base already part of it. Fewer
          pieces on the table and less to lose.
        roles:
          floor:
            deny:
              - connection|openforge
            allow:
              - connection|openlock

  - key: size
    prompt: What size tiles?
    default: 2x2
    # Not every footprint in the catalog is offered. Some of the larger ones
    # have no square base at all, so adding them would empty `floor-base`.
    blurb: >
      All tile sizes are in inches, which are also squares. Most people use
      2×2. 4×2 is handy for hallways, and a few systems have used 3×3 as
      their basis.

      Unlike walls, the thin sizes are fine here: a 1 inch wide floor makes
      a perfectly good hallway, it is only walls that crowd a mini at that
      width.
    options:
      - key: 1x1
        title: 1×1
        roles:
          floor:
            require:
              - size|width|1
              - size|depth|1
      - key: 2x1
        title: 2×1
        roles:
          floor:
            require:
              - size|width|2
              - size|depth|1
      - key: 2x2
        title: 2×2
        roles:
          floor:
            require:
              - size|width|2
              - size|depth|2
      - key: 3x1
        title: 3×1
        roles:
          floor:
            require:
              - size|width|3
              - size|depth|1
      - key: 3x3
        title: 3×3
        roles:
          floor:
            require:
              - size|width|3
              - size|depth|3
      - key: 4x1
        title: 4×1
        roles:
          floor:
            require:
              - size|width|4
              - size|depth|1
      - key: 4x2
        title: 4×2
        roles:
          floor:
            require:
              - size|width|4
              - size|depth|2
      - key: 4x4
        title: 4×4
        roles:
          floor:
            require:
              - size|width|4
              - size|depth|4

roles:
  floor:
    title: Floor
    # `allow: [shape|square]` is load-bearing: the shape sweep takes
    # `shape|square` too, and without sparing it this matches nothing.
    query:
      require:
        - shape|floor
      deny_children:
        - shape
        - component
      allow:
        - shape|square
    prefer:
      - texture|dungeon_stone|block
      - texture|dungeon_stone
      - size|width|2
      - size|depth|2
    avoid:
      - decoration
  floor-base:
    title: Base for the floor
    query:
      require:
        - shape|base
        - shape|base|square
      deny_children:
        - shape|base
    prefer:
      - texture|plain
    under: floor
    match:
      - size|width
      - size|depth

refinements:
  - key: texture
    role: floor
    browsable: true
    prompt: Floor texture
    default: texture|dungeon_stone
    from_namespace: texture
    # Blurbs carry no counts: the honest number depends on the size already
    # chosen, and size is asked first.
    choices:
      - tag: texture|dungeon_stone
        title: Dungeon stone
        blurb: >
          Cut flags, every one of them block or eroded; the recommendation
          is block.
      - tag: texture|rough_stone
        title: Rough stone
      - tag: texture|cut-stone
        title: Cut stone
      - tag: texture|towne
        title: Wood
        blurb: >
          All boarded, in two plank layouts: long planks, or a shorter
          wood.
      - tag: texture|aztlan
        title: Aztlan
      - tag: texture|nova_trail
        title: Nova Trail

  - key: base-clips
    role: "*"
    browsable: true
    # An exception rather than `role: floor-base`, so it still covers the
    # bases if this guide gains another one.
    except_roles:
      - floor
    group: How do the pieces clip together?
    prompt: The base
    when:
      selected:
        floor-print:
          - with-base
    default: connection|magnetic,connection|openlock,connection|openlock|topless
    blurb: >
      Clips are how the bases join to each other. There are two systems, and
      the honest answer is that it rarely matters: the consensus is that
      Dragonbite clips hold better and OpenLOCK clips are easier for rapid
      swapping, but most people agree they aren't different enough to worry
      about. Supporting both is built into how this project is developed,
      from the ground up.

      For what it is worth, I have more OpenLOCK tiles than DragonLock, and
      OpenLOCK is somewhat more widespread.

      Magnets are better if you lay tiles down at game time — they help you
      align tiles quickly, and frankly they have a pleasing feel. The flex
      magnetic bases take 5mm spheres and five cylindrical sizes: 5mm×3mm,
      5mm×2mm, 4mm×3mm, 4mm×2mm and 3/16"×1/8". They spin in place, so you
      never have to think about polarity.

      Topless removes the material above the clip bay, which is not thick to
      begin with: faster to print, and no supports to take out. Plain topless
      is the one to be careful with — with that material gone there is very
      little contact between the base and whatever you glue to it. Topless
      *with magnets* does not have that problem, and that is the combination
      recommended here: the magnetic base gives you plenty to glue to. If you
      want a single central OpenLOCK bay, which is a common choice, take the
      magnetic OpenLOCK base and simply don't fit the magnets. Unsupported is
      newer: modern printers bridge well enough that many people find they
      don't need supports at all.

      Print your clips in PETG, not PLA. PLA is rigid and brittle, so clips
      snap instead of flexing. Keep the bases in whatever you are printing
      everything else in — PETG is harder to glue and harder to paint.

      If a clip will not go into its bay, that is almost always the built-in
      supports: OpenLOCK and DragonLock clips both print with supports you
      have to snap out first. It is the question people ask most.
    links:
      5mm×3mm: https://amzn.to/3TiebAV
      5mm×2mm: https://amzn.to/3n2prFa
      4mm×3mm: https://amzn.to/3JOtXzd
      4mm×2mm: https://amzn.to/3looXJl
      3/16"×1/8": https://www.kjmagnetics.com/proddetail.asp?prod=D32AH
    titles:
      connection|openlock: OpenLOCK
      connection|dragonlock: DragonLock
      connection|magnetic: Magnets
    from_combination: connection
    exclude:
      - connection|magnetic|flex

  - key: floor-clips
    role: floor
    browsable: true
    group: How do the pieces clip together?
    prompt: The floor
    when:
      selected:
        floor-print:
          - single-piece
    default: connection|openlock
    blurb: |
      A one-piece tile carries its own clip bays, so the choice is made on
      the tile rather than on a base under it. It is a narrower choice than
      the base question offers: printed into a tile, OpenLOCK is all there
      is. No floor is made with DragonLock bays, and a one-piece tile cannot
      take magnets — if you want either, print the tile bare and choose a
      base, which is the other answer to the question above.

      Print it in whatever you are printing everything else in. The advice to
      use PETG applies to the clips, not to the tiles they go into: PLA is
      rigid enough that a clip snaps instead of flexing, while a tile has
      nothing to flex.

      Unsupported removes the built-in supports over the clip bay, on the
      bet that a modern printer bridges the gap cleanly. If a clip will not go
      into its bay, that is almost always the supports on the clip itself,
      which OpenLOCK clips print with and which you have to snap out first. It
      is the question people ask most.
    from_combination: connection
    # No floor carries dragonlock or magnetic, so those titles and the
    # exclusions below are inert — kept as cover for a growing catalog.
    titles:
      connection|openlock: OpenLOCK
      connection|dragonlock: DragonLock
      connection|magnetic: Magnets
    exclude:
      - connection|side
      - connection|openforge
