connection: |
  These tags represent the connection options for the tile. Dragonlock, Openlock, Openforge, Magnetic, Side, Pegs, and Topless are all options for how to connect tiles together.
connection|dragonlock: the DragonLock system from Fat Dragon Games.
connection|openlock: The OpenLock system from Printable Scenery
connection|openlock|topless: Openlock but with no bridging. easier to print and less fragile.
connection|openlock|unsupported: 'Openlock, but with no supports printed in place.  Use this if you want to put in your own supports, or if your printer is really good at bridging'
connection|openforge: A system where the parts are all printed separately, including a base that has actual connection options. This system is designed for mixing and matching and maximum flexibility.
connection|openforge|split: 'Various items where a top piece may or may not be applied.'
connection|magnetic: 'A magnetic system designed for using spheres'
connection|magnetic|flex: A magnetic system designed for using spheres or disks
connection|pegs: Openlock's pegs which help register tiles sitting on top of tiles.
connection|left: 'Items that require two parts (L/R) to create.  This is the left side.'
connection|right: 'Items that require two parts (L/R) to create.  This is the right side.'
connection|side: Openlock, but on the side of walls
connection|side|dragonlock: 'DragonLock, but on the side of walls'
connection|side|filament: 'Filament, but on the side of walls'
connection|side|openlock: 'OpenLock, but on the side of walls'
connection|topless: 'OpenLock without the overhang and therefore, no supports, which in turn means no sagging and less work after you print to get the tile ready.'


decoration: |
  These tags represent the decoration options for the tile. Air, Earth, Fire, Water, Demon, Celtic Knot are all options for how to decorate the tile.

interface: |
  Some parts are used for a multi part build. Interface is used to encode the tags that describe those relationships. So like a window can have a frame and shutters. Interface relates to how those parts connect to each other.
  Part defines the actual pieces.

part: |
  Some parts are used for a multi part build. Part defines the actual pieces.

scatter: |
  Scatter holds non tile stuff. Barrels, statues, that kind of thing.

shape: |
  Shape holds tags that define the actual shape of the intended part, and some times the role the part has in a tile.

size: |
  Size has the quantitative definitions. the tile is 2 squares on the x, 4 squares on the y. A curve is 90 degrees or 45. This does have some qualitative tags as well.

texture: |
  Texture holds tags that define the actual texture of the intended part. Dungeon stone, cut stone, towne, sewer, cave are all options for how to texture the tile.
texture|dungeon_stone: Openforge's flagship. Dungeon stone has the most parts for building an incredible variety of tiles. So far as we are aware, dungeon stone is the most complete set of gaming tiles produced in industry. One thing to be aware of, when i comes to floors, there are two floor textures. Eroded is the first texture we ever designed, and it is showing it's age, but it's the most complete. Block is a better design, but it still is missing a few floors.
texture|cut-stone: Designed to be a plain tile texture that looks good enough, but is intended to not distract visually. The second most complete set.
texture|towne: Whattle and daube tudor style buildings. Offers a bunch of visual options.
texture|sewer: Sewers. Get your ick on.
texture|cave: Natural caves
