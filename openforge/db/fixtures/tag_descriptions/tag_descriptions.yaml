build: |
  These tags are based around underlying system you want to use for building a tile.
  Wall on Tile for example has a wall that takes up part of the floor space, but is much easier to reason about when setting up a map quickly while GMing, while Separate Wall has the wall outside the floor, giving more play room,
  but is harder to tesselate.
build|separate wall: Wall off of tile. Gives more gameplay space, harder to reason about tesselating. Recommended for builds that the GM does between sessions in prep.  Separate walls are also used to build walls on tile via the s2w system.
build|wall on tile: Wall is on the tile taking up half a floor. Gives less game space, so you probably need to alter maps a little to accomodate. Much easier to reason about quickly. Recommended for GMs who build the map during game time.
build|s2w: A combined system that lets you make wall on tile using separate wall components. This is the future, as it lets you use the same parts to accomplish both.  Most of the parts for this system are tagged as separate wall, only special parts used as adapters, or corners are tagged with this tag.
build|s-system: Combines a wall with a floor in a system that works pretty well for maps with lots of rooms with shared walls. Very easy to reason about
build|thick wall: Used generally for underground locations, and designed to be more visually impressive. Caves, mines, dwarven halls, sewers. Every wall takes up a full inch.

