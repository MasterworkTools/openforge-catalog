- name: "S2W: Wall on Tile: Wall: Low Wall (Single Piece)"
  type: "blueprint"
  tags:
    - object|tile
    - object|tile|wall_on_tile
    - build|s2w
    - build|s2w|single_piece
    - component|wall|low
    - shape|wall
  config:
    parts:
      - name: wall
        tags:
          require:
            - tag: build|separate wall
            - tag: shape|wall|low
            - tag: connection|openforge
          deny:
            - tag: shape|curved
            - tag: size|width|1.5
            - tag: component|secret_door
          constrain:
            - tag: size|width
        fulfills:
          - part: base
      - name: floor
        tags:
          require:
            - tag: shape|floor
            - tag: shape|floor|wall
            - tag: build|s2w
          constrain:
            - tag: size|width
            - tag: size|depth
      - name: base
        tags:
          require:
            - tag: shape|base
            - tag: shape|base|square
          deny:
            - tag: shape|wall
            - tag: build|s2w
            - tag: shape|option|notch
          constrain:
            - tag: size|width
            - tag: size|depth

- name: "S2W: Wall on Tile: Wall: Low Wall (Modular)"
  type: "blueprint"
  tags:
    - object|tile
    - object|tile|wall_on_tile
    - build|s2w
    - build|s2w|modular
    - component|wall|low
    - shape|wall
  config:
    parts:
      - name: wall
        tags:
          require:
            - tag: build|separate wall
            - tag: shape|wall|low
          deny:
            - tag: shape|curved
            - tag: size|width|1.5
            - tag: component|secret_door
          constrain:
            - tag: size|width
      - name: floor
        tags:
          require:
            - tag: shape|floor
            - tag: shape|floor|wall
            - tag: build|s2w
          constrain:
            - tag: size|width
            - tag: size|depth
      - name: base
        tags:
          require:
            - tag: shape|base
            - tag: shape|base|wall
            - tag: build|s2w
          deny:
            - tag: shape|base|corner
            - tag: shape|option|notch
          constrain:
            - tag: size|width
            - tag: size|depth
            - tag: connection
              siblings: [wall]
            - filter: connection|side
            - filter: connection|openforge
