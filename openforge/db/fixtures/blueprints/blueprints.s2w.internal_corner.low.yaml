- name: "S2W: Wall on Tile: Internal Corner: Low (Single Piece)"
  type: "blueprint"
  tags:
    - object|tile
    - object|tile|wall_on_tile
    - build|s2w
    - build|s2w|single_piece
    - shape|internal_corner|low
  config:
    parts:
      - name: column
        tags:
          require:
            - tag: shape|column|corner
            - tag: shape|column|low
            - tag: build|s2w
            - tag: size|column_shape|L
      - name: floor
        tags:
          require:
            - tag: shape|floor
            - tag: shape|floor|internal_corner
            - tag: build|s2w
            - tag: size|width|2
            - tag: size|depth|2
      - name: base
        tags:
          require:
            - tag: shape|base
            - tag: shape|base|square
            - tag: size|width|2
            - tag: size|depth|2
          deny:
            - tag: shape|wall
            - tag: build|s2w
            - tag: shape|option|notch

