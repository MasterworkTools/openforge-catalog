name: Tests

# The four test jobs, defined once. The Test, Staging and Production
# workflows all call this, so a gate added here applies to all three and any
# one sha is tested once.
#
# A called workflow inherits neither `permissions` nor `defaults` from its
# caller, so both are set here.
on:
  workflow_call:

permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  python-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: openforge
          POSTGRES_PASSWORD: openforge
          POSTGRES_DB: openforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Run tests
      env:
        PGHOST: localhost
        PGUSER: openforge
        PGPASSWORD: openforge
        PGDATABASE: openforge_test
        PGPORT: 5432
      run: |
        pytest tests/ --cov=openforge

  react-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run React tests
        run: npm test

  js-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run linting and type checking
        run: npm run lint:all

      - name: Build frontend
        run: npm run build

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.6
      - name: Run ruff linting
        run: ruff check .
      - name: Run ruff formatting check
        run: ruff format --check .
