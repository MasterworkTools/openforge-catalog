name: Test

on:
  pull_request:
    branches: [ test, main ]
  push:
    branches: [ test, main ]

jobs:
  python-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: openforge
          POSTGRES_PASSWORD: openforge
          POSTGRES_DB: openforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Run tests
      env:
        PGHOST: localhost
        PGUSER: openforge
        PGPASSWORD: openforge
        PGDATABASE: openforge_test
        PGPORT: 5432
      run: |
        pytest tests/ --cov=openforge

  react-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run React tests
        run: npm test

  js-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run linting and type checking
        run: npm run lint:all

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.6
      - name: Run ruff linting
        run: ruff check .
      - name: Run ruff formatting check
        run: ruff format --check .

  version-bump:
    # Anything that reaches the built site has to come with a version
    # bump. The header on every page shows that number, so "which build
    # am I looking at" has an answer — and a release that changed the
    # site without changing the version makes that answer a lie.
    #
    # Pull requests only. A push to `test` or `main` is a merge of work
    # this already checked, and there is no base to compare it against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The whole history, because the check is a diff against the
          # base branch and a shallow clone does not contain it.
          fetch-depth: 0

      - name: Require a version bump for changes that ship
        env:
          BASE: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          if [[ ",$LABELS," == *",no-version-bump,"* ]]; then
            echo "Skipped: the pull request carries the no-version-bump label."
            exit 0
          fi

          changed=$(git diff --name-only "origin/$BASE...HEAD")

          # What ships: the frontend sources and the things that build
          # them. Tests are excluded deliberately — they do not reach
          # the site, and making them count would mean bumping the
          # version to fix a typo in an assertion, which teaches people
          # to bump without meaning it.
          shipped=$(echo "$changed" \
            | grep -E '^(src/|public/|next\.config\.js|package\.json|package-lock\.json)' \
            | grep -vE '(^src/.*__tests__/|\.test\.(ts|tsx|js|jsx)$|^src/test-utils/)' \
            || true)

          if [[ -z "$shipped" ]]; then
            echo "No shipping changes; no bump needed."
            exit 0
          fi

          before=$(git show "origin/$BASE:package.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          after=$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')

          if [[ "$before" == "$after" ]]; then
            echo "::error::These changes reach the site, but package.json is still $before."
            echo
            echo "Files that ship:"
            echo "$shipped" | sed 's/^/  /'
            echo
            echo "Bump the version in package.json. The page header reads it from"
            echo "there at build time, so there is nothing else to change."
            echo
            echo "If this genuinely should not carry a bump, add the no-version-bump"
            echo "label to the pull request."
            exit 1
          fi

          echo "Version $before -> $after, with shipping changes. Good."
