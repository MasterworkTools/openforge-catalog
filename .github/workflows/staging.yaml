name: Staging

on:
  push:
    branches: [test]
concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false # a cancelled tofu apply leaves a half-applied state and a held lock
permissions:
  id-token: write
  contents: read
defaults:
  run:
    shell: bash

jobs:
  python-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: openforge
          POSTGRES_PASSWORD: openforge
          POSTGRES_DB: openforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Run tests
      env:
        PGHOST: localhost
        PGUSER: openforge
        PGPASSWORD: openforge
        PGDATABASE: openforge_test
        PGPORT: 5432
      run: |
        pytest tests/ --cov=openforge

  react-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run React tests
        run: npm test

  js-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Run linting and type checking
        run: npm run lint:all

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.6
      - name: Run ruff linting
        run: ruff check .
      - name: Run ruff formatting check
        run: ruff format --check .
  docker-build:
    name: Staging Docker Build
    needs: [python-test, react-test, js-lint, python-lint]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Context for Buildx
        run: |
          docker context create builders

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          endpoint: builders


      - name: Configure Staging OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.ECR_IAM_STAGING }}
          role-session-name: staging-ecr
          aws-region: us-east-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
        id: login-com-test-ecr
        with:
          mask-password: true

      - name: Docker Build and Push
        id: docker-build
        if: ${{ ! inputs.use_cache }}
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile.api.deploy
          push: true
          platforms: linux/amd64
          provenance: false
          tags: "682033461796.dkr.ecr.us-east-1.amazonaws.com/openforge_catalog/api:${{ github.sha }}"

  tofu-apply:
    name: Staging Tofu Apply
    needs: docker-build
    if: ${{ needs.docker-build.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    outputs:
      migrate_function: ${{ steps.tofu.outputs.migrate_function }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure Staging deploy role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          role-session-name: staging-tofu
          aws-region: us-east-1

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.0"
          tofu_wrapper: false

      # Deploys the image this run just pushed: the Lambda's image_uri is the git sha.
      # Until this job existed, nothing ever pointed the staging function at a new
      # image, so staging served a current frontend against a nine-month-old backend.
      - name: tofu apply
        id: tofu
        working-directory: terraform/environments/staging
        run: |
          tofu init -input=false
          tofu plan -input=false -no-color -var image_tag=${{ github.sha }} -out=tfplan
          tofu apply -input=false -auto-approve tfplan
          echo "migrate_function=$(tofu output -raw migrate_function_name)" >> "$GITHUB_OUTPUT"

  migrate:
    name: Staging Migrate
    needs: tofu-apply
    if: ${{ needs.tofu-apply.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure Staging deploy role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
          role-session-name: staging-migrate
          aws-region: us-east-1

      # The schema goes first and the frontend last, so the site is never promoted
      # in front of a database that cannot serve it. The runner has no route into
      # the VPC; this invokes the function that does (openforge/app/migrate.py).
      - name: Apply database migrations
        env:
          FUNCTION: ${{ needs.tofu-apply.outputs.migrate_function }}
        run: |
          aws lambda invoke --function-name "$FUNCTION" \
            --cli-binary-format raw-in-base64-out --payload '{}' \
            response.json > invoke.json

          echo "--- invoke metadata"; cat invoke.json; echo
          echo "--- payload";         cat response.json; echo

          # `aws lambda invoke` exits 0 for a function that raised, so the metadata
          # has to be read. A throttle is different: reserved concurrency is 1, so a
          # second deploy's invoke is rejected outright and the CLI exits non-zero
          # above rather than reaching this.
          python3 - <<'PY'
          import json, sys

          meta = json.load(open("invoke.json"))
          if meta.get("FunctionError"):
              sys.exit(f"migration failed ({meta['FunctionError']}); see the payload above")

          payload = json.load(open("response.json"))
          if payload.get("ok") is not True:
              sys.exit(f"migration did not report ok: {payload}")

          before, after = payload["schema_version_before"], payload["schema_version_after"]
          print(f"schema {before} -> {after} (applied={payload['applied']})")
          PY

  frontend-deploy:
    name: Staging Frontend Deploy
    needs: migrate
    if: ${{ needs.migrate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # npm, not pnpm: package-lock.json is the only lockfile in this repo, so pnpm
      # resolved newer deps than the tests run against and the build failed on React
      # Compiler lint errors that never reach the test jobs.
      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # The build is environment-agnostic; this is what makes staging say so.
      - name: Write staging runtime config
        run: |
          cat > out/app-config.json <<'JSON'
          {
            "BASE_GENERATOR_URL": "https://openscad.openforge.tools",
            "ENVIRONMENT": "staging",
            "PRODUCTION_URL": "https://openforge.tools"
          }
          JSON

      - name: Configure Staging S3 Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.ECR_IAM_STAGING }}
          role-session-name: staging-s3
          aws-region: us-east-1

      - name: Deploy to S3
        env:
          BUCKET: staging-openforge-catalog-website
          SHA: ${{ github.sha }}
        run: |
          cd out
          # An immutable copy of this build, kept so any past build can be put back.
          aws s3 sync . "s3://$BUCKET/$SHA"
          # Promote it to the prefix CloudFront serves. Hashed assets first and the HTML
          # that references them second, so a visitor mid-promotion never gets a page
          # whose assets have not arrived. Nothing is deleted: old hashed assets are
          # harmless and still serve anyone who loaded the previous page.
          # `cp --recursive`, not `sync`: sync skips a key whose destination is the same
          # size and not older, which silently makes putting an older build back a no-op.
          aws s3 cp --recursive "s3://$BUCKET/$SHA" "s3://$BUCKET/current" --exclude "*.html"
          aws s3 cp --recursive "s3://$BUCKET/$SHA" "s3://$BUCKET/current" --exclude "*" --include "*.html"
          echo "Deployed to staging: current now serves $SHA"
